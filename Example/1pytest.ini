[pytest]

markers =
    regression: тесты регресса(игнор warning в терминале)
    smoke: смоук тесты
    integro: интеграционные тесты
addopts =
    -sv
    --reruns=1
    --only-rerun TimeoutException
    --only-rerun HTTPSConnectionPool
    --only-rerun StaleElementReferenceException
    --only-rerun InvalidSessionIdException
    --clean-alluredir

